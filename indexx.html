<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Class Leaderboard</title>
<style>
  body { font-family: system-ui, Arial; margin: 2rem; background: #f7f9fc; }
  .card { max-width: 560px; background: #fff; padding: 16px 20px; border-radius: 12px; box-shadow: 0 10px 24px rgba(0,0,0,0.06); }
  h1 { margin: 0 0 12px; }
  label { display:block; margin-top: 10px; }
  input { width:100%; padding:10px; border:1px solid #d9e1ee; border-radius: 8px; }
  button { margin-top: 10px; padding: 10px 12px; border: 0; border-radius: 8px; background:#2563eb; color:#fff; cursor:pointer; }
  table { width:100%; border-collapse: collapse; margin-top: 14px; }
  th, td { text-align:left; padding:8px; border-bottom:1px solid #eef2f7; }
  .hint { color:#6b7280; font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>
  <div class="card">
    <h1>Class Leaderboard</h1>
    <form id="submitForm">
      <label>Name (alias is fine)
        <input id="name" required maxlength="40" placeholder="e.g., StarCoder27" />
      </label>
      <label>Score
        <input id="score" type="number" min="0" value="0" />
      </label>
      <button type="submit">Submit Score</button>
    </form>

    <p class="hint">We store only name + score. Use a nickname, not real names.</p>

    <h2>Top Scores</h2>
    <table id="board">
      <thead><tr><th>#</th><th>Name</th><th>Score</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

<script>
const API = 'WEB_APP_URL_HERE';

async function loadBoard(){
  const res = await fetch(API, { method:'GET' });
  const data = await res.json();
  const tbody = document.querySelector('#board tbody');
  tbody.innerHTML = '';
  if (data.ok) {
    data.leaderboard.forEach((row, i) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${i+1}</td><td>${escapeHtml(row.name)}</td><td>${row.score}</td>`;
      tbody.appendChild(tr);
    });
  }
}

document.getElementById('submitForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const name = document.getElementById('name').value.trim();
  const score = Number(document.getElementById('score').value || 0);
  if(!name) return alert('Please enter a name or alias.');
  await fetch(API, {
    method:'POST',
    headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ name, score })
  });
  document.getElementById('score').value = '0';
  await loadBoard();
});

function escapeHtml(s){
  const p = document.createElement('p');
  p.textContent = s;
  return p.innerHTML;
}

loadBoard();
</script>
</body>
</html>

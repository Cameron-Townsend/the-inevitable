<!doctype html>
<html lang="en">
<head>
  <!-- Let the page support both color schemes -->
<meta name="color-scheme" content="light dark">

<!-- Set theme color for light/dark (address bar color on mobile) -->
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f9fc">
<meta name="theme-color" media="(prefers-color-scheme: dark)"  content="#0b0f1a">

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Class Challenges Hub</title>
  <link rel="stylesheet" href="style.css?v=10">
</head>
<body>
  <div class="wrap">

    <div class="grid">
      <!-- Auth / Profile -->
      <div class="card">
        <h1>Class Challenges</h1>
        <p class="muted">Solve activities, earn currency, climb the leaderboard.</p>

        <div id="auth">
          <h2>Sign In</h2>
          <label>Student ID <input id="userId" autocomplete="off" /></label>
          <label>PIN <input id="pin" type="password" autocomplete="off" /></label>
          <div class="flex">
            <button id="loginBtn">Login</button>
            <button id="registerBtn" title="First time here?">Register</button>
          </div>
          <p id="authMsg" class="muted"></p>
        </div>

        <div id="profile" style="display:none;">
          <div class="flex">
            <strong id="greeting"></strong>
            <span class="badge">Balance: <span id="balance">0</span> 🪙</span>
          </div>
          <button id="logoutBtn" class="btn-gray">Logout</button>
        </div>
      </div>

      <!-- Leaderboard (always visible) -->
      <div class="card">
        <h2>Leaderboard (Top 20)</h2>
        <table>
          <thead><tr><th>#</th><th>Name</th><th>Currency</th></tr></thead>
          <tbody id="boardBody"></tbody>
        </table>
        <p class="muted">Updates when scores are submitted.</p>
      </div>
    </div>

    <div class="space"></div>

    <!-- Activities (hidden until login) -->
    <div class="card" id="activitiesCard" style="display:none;">
      <div class="row">
        <h2>Today’s Activities</h2>
        <button id="refreshBtn" title="Reload activities">Refresh</button>
      </div>
      <div id="activities" class="grid"></div>
    </div>

  </div>

  <!-- Optional config first (set API URL here) -->
  <script src="config.js?v=5"></script>
  <!-- Main app logic -->
  <script src="app.js?v=5"></script>
</body>
</html>

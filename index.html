<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Classroom Challenge</title>
  <link rel="stylesheet" href="style.css?v=uc19" />
</head>
<body data-state="identify">
  <div id="identifyPanel" class="auth-layout">
    <h1>Classroom Challenge</h1>
    <input id="idOnly" placeholder="Enter ID" />
    <button id="idLoginBtn">Login</button>
    <button id="idRegisterBtn">Register</button>
  </div>

  <div id="pinPanel" class="auth-layout hidden">
    <input id="pin" placeholder="Enter PIN" />
    <button id="primaryAuthBtn">Continue</button>
    <button id="backToIdBtn">Back</button>
  </div>

  <div id="dashboard" class="dashboard hidden">
    <header>
      <span id="displayName"></span>
      <span id="coinBalance"></span>
      <button id="logoutBtn">Logout</button>
    </header>
    <section id="leaderboard"></section>
    <section id="activities"></section>
    <section id="archiveList" class="hidden"></section>
    <button id="archiveToggle">Archive</button>
    <div id="toast"></div>
    <div id="busyOverlay" class="hidden"></div>
  </div>

  <footer>
    <p>&copy; <span id="year"></span> Classroom Challenge v19.1.5r</p>
  </footer>

  <script src="config.js"></script>
  <script src="app.js?v=uc19"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>

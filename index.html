<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Classroom Challenge</title>
  <link rel="stylesheet" href="style.css?v=v1921" />
</head>
<body>
  <header class="app-header">
    <h1>Classroom Challenge</h1>
  </header>

  <main class="app-main">
    <section class="auth">
      <div class="card">
        <h2>Login / Register</h2>
        <div class="grid">
          <div class="col">
            <label>User ID</label>
            <input id="userId" type="text" autocomplete="off" placeholder="e.g. skyfox123" />
          </div>
          <div class="col">
            <label>PIN</label>
            <input id="pin" type="password" autocomplete="off" placeholder="4+ digits" />
          </div>
        </div>
        <div class="row actions">
          <button id="btnLogin" class="btn">Login</button>
          <button id="btnRegister" class="btn btn-ghost">Register</button>
        </div>
        <div id="authBusy" class="busy" hidden>Working…</div>
        <div id="authToast" class="toast" hidden></div>
      </div>

      <div class="card">
        <h3>Top Students</h3>
        <ol id="leaderboard" class="leaderboard"></ol>
      </div>
    </section>

    <section id="dash" class="dash" hidden>
      <div class="card profile">
        <h2>Profile 👤</h2>
        <img id="profile-avatar" class="avatar-chip" alt="avatar" />
        <div class="grid compact">
          <div><strong>Name:</strong> <span id="displayName">—</span></div>
          <div><strong>Coins:</strong> <span id="coinBalance">0</span> 🪙</div>
        </div>
        <div id="avatar-picker" class="mt-2"></div>
      </div>

      <div class="card">
        <h2>Activities</h2>
        <div id="activities" class="tiles"></div>
      </div>

      <div class="card">
        <h2>Archive</h2>
        <div id="archivePanel" class="archive"></div>
      </div>
    </section>
  </main>

  <script src="config.js?v=v1921"></script>
  <script src="plugins/avatarPicker.js?v=v1921"></script>
  <script src="app.js?v=v1921"></script>

  <!-- No snippets: full stability patch is baked into app.js -->

  <div style="text-align:center; opacity:.7; font-size:12px; margin-top:8px;">
    Build 2025-10-30.v19.2.1
  </div>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Class Activity</title>
<style>
  body { font-family: system-ui, Arial; background:#f7f9fc; margin:0; padding:24px; }
  .wrap { max-width: 720px; margin: 0 auto; }
  .card { background:#fff; padding:20px; border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,.06); }
  h1 { margin:0 0 12px; }
  label { display:block; margin:10px 0 6px; }
  input, button { padding:10px; font-size:16px; }
  input { width:100%; border:1px solid #d9e1ee; border-radius:8px; box-sizing:border-box; }
  button { border:0; border-radius:8px; background:#2563eb; color:#fff; cursor:pointer; }
  button[disabled] { background:#9db5f1; cursor:not-allowed; }
  .msg { margin:12px 0; padding:12px; background:#eef6ff; border:1px solid #d3e8ff; border-radius:8px; display:none; }
  .row { display:grid; grid-template-columns: 1fr auto; gap:8px; }
  table { width:100%; border-collapse:collapse; margin-top:14px; }
  th, td { text-align:left; padding:8px; border-bottom:1px solid #eef2f7; }
  .hint { font-size:12px; color:#6b7280; margin-top:8px; }
  .section { margin-top:18px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Enter Code</h1>
    <div class="row">
      <input id="code" type="password" placeholder="Enter your activity code" autocomplete="off" />
      <button id="unlockBtn">Unlock</button>
    </div>
    <div id="secretBox" class="msg" aria-live="polite"></div>

    <div id="scoreSection" class="section" style="display:none;">
      <h2>Submit Score</h2>
      <label for="name">Name (nickname is fine)</label>
      <input id="name" maxlength="40" placeholder="e.g., StarCoder27" />
      <label for="score">Score</label>
      <input id="score" type="number" min="0" value="0" />
      <button id="submitScoreBtn">Submit</button>
      <p class="hint">We store only nickname + score + code used.</p>
    </div>

    <div class="section">
      <h2>Leaderboard (Top 20)</h2>
      <table>
        <thead><tr><th>#</th><th>Name</th><th>Score</th></tr></thead>
        <tbody id="boardBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbzxaAo_ixMxwjQbHSKASggQAOmqSZm_oeleZqV8bzXhpmHrtxExoMShWZIA6N-RRaaYtg/exec'; // ← paste your Apps Script Web App URL (…/exec)

const codeInput       = document.getElementById('code');
const unlockBtn       = document.getElementById('unlockBtn');
const secretBox       = document.getElementById('secretBox');
const scoreSection    = document.getElementById('scoreSection');
const nameInput       = document.getElementById('name');
const scoreInput      = document.getElementById('score');
const submitScoreBtn  = document.getElementById('submitScoreBtn');
const boardBody       = document.getElementById('boardBody');

let lastUnlockedCode = '';

unlockBtn.addEventListener('click', unlock);
codeInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') unlock(); });
submitScoreBtn.addEventListener('click', submitScore);

// --- Patched: use form-encoded body (no JSON header) to avoid CORS preflight
async function unlock() {
  const code = codeInput.value.trim();
  if (!code) { alert('Enter a code'); return; }
  setBusy(unlockBtn, true);
  try {
    const res = await fetch(API, {
      method: 'POST',
      body: new URLSearchParams({ action: 'unlock', code })
    });
    const data = await res.json();
    if (data.ok) {
      lastUnlockedCode = code;
      secretBox.style.display = 'block';
      secretBox.textContent = data.message;
      scoreSection.style.display = 'block';
    } else {
      secretBox.style.display = 'none';
      scoreSection.style.display = 'none';
      alert('No message for that code. Try again.');
    }
  } catch (e) {
    alert('Network error. Check your Web App URL and permissions.');
  } finally {
    setBusy(unlockBtn, false);
  }
}

async function submitScore() {
  const name  = nameInput.value.trim();
  const score = Number(scoreInput.value || 0);
  if (!name) { alert('Please enter a name or nickname.'); return; }
  if (!lastUnlockedCode) { alert('Unlock a code first.'); return; }
  setBusy(submitScoreBtn, true);
  try {
    await fetch(API, {
      method: 'POST',
      body: new URLSearchParams({
        action: 'submitScore',
        name,
        score: String(score),
        code: lastUnlockedCode
      })
    });
    scoreInput.value = '0';
    await loadLeaderboard();
    alert('Score submitted!');
  } catch (e) {
    alert('Network error. Check your Web App URL and permissions.');
  } finally {
    setBusy(submitScoreBtn, false);
  }
}

async function loadLeaderboard() {
  try {
    const res = await fetch(API + '?action=leaderboard');
    const data = await res.json();
    boardBody.innerHTML = '';
    if (data.ok) {
      data.leaderboard.forEach((row, i) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${i+1}</td><td>${escapeHtml(row.name)}</td><td>${row.score}</td>`;
        boardBody.appendChild(tr);
      });
    }
  } catch (e) {
    // If leaderboard fails to load, keep page usable without crashing
  }
}

function escapeHtml(s){
  const p = document.createElement('p');
  p.textContent = s;
  return p.innerHTML;
}
function setBusy(btn, busy){
  btn.disabled = !!busy;
  btn.textContent = busy ? 'Please wait…' : (btn === unlockBtn ? 'Unlock' : 'Submit');
}

// Load leaderboard for every visitor on page load
loadLeaderboard();
</script>
</body>
</html>

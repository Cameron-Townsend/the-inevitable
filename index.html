<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Classroom Challenge — v19.1.6d Patch</title>
  <link rel="icon" href="favicon.ico" />
  <link rel="stylesheet" href="style.css?v=uc20" />
</head>
<body data-state="identify">
  <script src="config.js"></script>

  <!-- Auth + Dashboard layout assumed unchanged from v19.1.5r -->
  <div id="app">
    <div class="auth-layout grid two">
      <section id="authPanels">
        <div id="identifyPanel" class="card">Identify</div>
        <div id="pinPanel" class="card">PIN</div>
      </section>
      <section id="dashboard" class="card" hidden>
        <header class="row between">
          <div class="profile">
            <img id="profileAvatar" class="avatar-img" alt="avatar" />
            <span id="displayName"></span>
            <button id="openAvatarPicker" class="btn small" type="button">Change Avatar</button>
          </div>
          <div class="coins">
            <span id="coinBalance">0</span> 🪙
          </div>
        </header>
        <div id="leaderboard"></div>
        <div id="activities"></div>
        <aside id="archive" class="archive"></aside>
      </section>
    </div>
  </div>

  <!-- Order: config.js, core app.js, then avatar patch & plugin (cache-busted) -->
  
  
  
  
  <script src="app.js?v=uc20"></script>
  <script src="app-avatar-patch.js?v=uc20"></script>
  <script src="plugins/avatarPicker.js?v=uc20"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Classroom Challenge</title>
  <link rel="stylesheet" href="style.css?v=cc2" />
</head>
<body>
  <header class="app-bar">
    <h1>Classroom Challenge</h1>
    <div class="spacer"></div>
    <label class="remember"><input type="checkbox" id="rememberPin"> Remember PIN on this device</label>
    <button id="themeToggle" aria-label="Toggle theme">🌓</button>
  </header>

  <main>
    <!-- Step 1: Identify (precache happens here) -->
    <section id="identifyPanel" class="card">
      <h2>Welcome</h2>
      <div class="row"><label>Student ID <input id="idOnly" autocomplete="username"></label></div>
      <div class="actions">
        <button id="idNextBtn">Next</button>
      </div>
      <p id="idMsg" class="msg"></p>
      <p id="precacheHint" class="muted hidden">Loading activities…</p>
    </section>

    <!-- Step 2: PIN -->
    <section id="pinPanel" class="card hidden">
      <h2 id="helloName">Hi!</h2>
      <div class="row"><label>PIN <input id="pin" type="password" autocomplete="current-password"></label></div>
      <div class="actions">
        <button id="loginBtn">Login</button>
        <button id="registerBtn" class="secondary">Register</button>
      </div>
      <p id="loginMsg" class="msg"></p>
    </section>

    <!-- App -->
    <section id="dashboard" class="hidden">
      <div class="grid two">
        <div class="card" id="profileCard">
          <h2>Profile</h2>
          <p><strong id="displayName">—</strong></p>
          <p>Coins: <span id="coinBalance">0</span></p>
          <button id="logoutBtn" class="secondary">Logout</button>
        </div>
        <div class="card" id="boardCard">
          <h2>Leaderboard</h2>
          <ol id="leaderboard"></ol>
        </div>
      </div>

      <section class="card" id="activitiesCard">
        <h2>Activities</h2>
        <div id="activities" class="activities"></div>
      </section>
    </section>
  </main>

  <footer class="footer">© <span id="year"></span> • Classroom Challenge</footer>
  <script>
    if('serviceWorker' in navigator){ navigator.serviceWorker.register('./sw.js'); }
  </script>
  <!-- Load config BEFORE app.js so the URL persists across patches -->
  <script src="config.js?v=1"></script>
  <script src="app.js?v=cc2"></script>
</body>
</html>

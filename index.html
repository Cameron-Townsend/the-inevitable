<!doctype html>
<html lang="en">
<head>
  <!-- Let the page support both color schemes -->
<meta name="color-scheme" content="light dark">

<!-- Set theme color for light/dark (address bar color on mobile) -->
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f9fc">
<meta name="theme-color" media="(prefers-color-scheme: dark)"  content="#0b0f1a">

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Class Challenges Hub</title>
  <link rel="stylesheet" href="style.css?v=20">
</head>
<body>
  <div class="wrap">

    <div class="grid">
      <!-- AUTH CARD -->
<div id="auth" class="card">
  <h2>Welcome</h2>
  <p class="muted">Enter your User ID to continue.</p>

  <div id="step-uid">
    <label>User ID
      <input id="userId" autocomplete="username" />
    </label>
    <div class="flex" style="margin-top:10px">
      <button id="continueBtn">Continue</button>
    </div>
    <p id="authMsg" class="muted"></p>
  </div>

  <div id="step-pin" style="display:none">
    <p class="muted">Hello, <span id="helloName"></span>. Enter your PIN.</p>
    <label>PIN
      <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" />
    </label>
    <div class="flex" style="margin-top:10px">
      <button id="loginBtn">Login</button>
      <button id="backToIdBtn" class="btn-gray">Back</button>
    </div>
  </div>

  <div id="step-register" style="display:none">
    <p class="muted">New user. Create your display name & PIN.</p>
    <label>Display Name
      <input id="displayName" maxlength="40" />
    </label>
    <label>PIN
      <input id="pinNew" type="password" inputmode="numeric" autocomplete="new-password" />
    </label>
    <div class="flex" style="margin-top:10px">
      <button id="registerBtn">Register</button>
      <button id="backToIdBtn2" class="btn-gray">Back</button>
    </div>
  </div>
</div>


      <!-- Leaderboard (always visible) -->
      <div class="card">
        <h2>Leaderboard (Top 20)</h2>
        <table>
          <thead><tr><th>#</th><th>Name</th><th>Currency</th></tr></thead>
          <tbody id="boardBody"></tbody>
        </table>
        <p class="muted">Updates when scores are submitted.</p>
      </div>
    </div>

    <div class="space"></div>

    <!-- Activities (hidden until login) -->
    <div class="card" id="activitiesCard" style="display:none;">
      <div class="row">
        <h2>Today’s Activities</h2>
        <button id="refreshBtn" title="Reload activities">Refresh</button>
      </div>
      <div id="activities" class="grid"></div>
    </div>

  </div>

  <!-- Optional config first (set API URL here) -->
  <script src="config.js?v=20"></script>
  <!-- Main app logic -->
  <script src="app.js?v=20"></script>
</body>
</html>
